<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keith & Em's Fantasy Playoffs 2026</title>
  <style>
    :root {
      --bg: #09090f;
      --card: #111118;
      --card2: #16161f;
      --border: #1e1e2e;
      --gold: #c9a227;
      --gold2: #f0d060;
      --red: #c8102e;
      --text: #ededf8;
      --muted: #888;
      --dim: #555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
    }
    a { color: inherit; text-decoration: none; }

    /* ── Header ── */
    header {
      max-width: 1100px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .logo {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--red), #1a1080);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(200,16,46,0.3);
    }
    .header-text h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-text p { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
    .header-right { margin-left: auto; text-align: right; }
    #last-updated { color: var(--dim); font-size: 0.75rem; }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(200,16,46,0.15);
      border: 1px solid rgba(200,16,46,0.4);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #ff4060;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ff4060;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── Loading / Error ── */
    #loading, #error {
      max-width: 400px; margin: 80px auto; text-align: center;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p, #error p { color: var(--muted); font-size: 0.9rem; }
    #error p { color: #ff6070; }

    /* ── Main layout ── */
    .main { max-width: 1100px; margin: 0 auto; }

    /* ── Leaderboard ── */
    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--dim);
      margin-bottom: 12px;
    }
    .leaderboard {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 32px;
    }
    .lb-row {
      display: grid;
      grid-template-columns: 44px 1fr 80px 80px;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:hover { background: var(--card2); }
    .lb-row.lb-header {
      padding: 10px 18px;
      background: #0e0e18;
      pointer-events: none;
    }
    .lb-rank {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--dim);
      text-align: center;
    }
    .lb-rank.gold { color: #f0c030; }
    .lb-rank.silver { color: #b0b8c0; }
    .lb-rank.bronze { color: #c07840; }
    .lb-name { font-weight: 700; font-size: 0.95rem; }
    .lb-bar-cell { padding-right: 12px; }
    .lb-bar-bg {
      height: 6px; border-radius: 3px;
      background: var(--border);
      overflow: hidden;
    }
    .lb-bar-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      transition: width 0.6s ease;
    }
    .lb-total {
      text-align: right;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--gold);
    }
    .lb-header .lb-rank,
    .lb-header .lb-name,
    .lb-header .lb-bar-cell,
    .lb-header .lb-total {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--dim);
    }

    /* ── Team cards grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 800px) { .cards-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 520px) { .cards-grid { grid-template-columns: 1fr; } }

    .team-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .card-header {
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .card-owner {
      display: flex; align-items: center; gap: 10px;
    }
    .owner-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .owner-name { font-weight: 700; font-size: 0.95rem; }
    .owner-rank {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 1px;
    }
    .card-total {
      text-align: right;
    }
    .total-num {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1;
      color: var(--gold);
    }
    .total-label {
      font-size: 0.65rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* player rows */
    .player-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid #13131c;
      font-size: 0.82rem;
    }
    .player-row:last-child { border-bottom: none; }
    .team-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .player-name-cell { font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-stats {
      display: flex; gap: 8px;
      align-items: center;
      white-space: nowrap;
    }
    .stat-chip {
      font-size: 0.7rem;
      color: var(--muted);
    }
    .pra-val {
      font-weight: 800;
      font-size: 0.88rem;
      min-width: 26px;
      text-align: right;
    }
    .no-games { color: var(--dim); font-size: 0.72rem; }
  </style>
</head>
<body>

<header>
  <div class="logo">🏀</div>
  <div class="header-text">
    <h1>Keith &amp; Em's Fantasy Playoffs</h1>
    <p>2026 NBA Playoffs · Round 2+ · PRA from draft day</p>
  </div>
  <div class="header-right">
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    <div id="last-updated">Loading…</div>
  </div>
</header>

<div id="loading">
  <div class="spinner"></div>
  <p>Fetching playoff stats…</p>
</div>

<div id="error" style="display:none">
  <p id="error-msg">Failed to load scores. Try refreshing.</p>
</div>

<div class="main" id="main" style="display:none">
  <div class="section-title">Standings</div>
  <div class="leaderboard" id="leaderboard"></div>

  <div class="section-title" style="margin-top:28px">Teams</div>
  <div class="cards-grid" id="cards"></div>
</div>

<script>
const NBA_COLORS = {
  OKC: '#007AC1', SA:  '#C4CED4', LAL: '#552583', MIN: '#00d44a',
  DET: '#C8102E', CLE: '#860038', NY:  '#F58426', PHI: '#006BB6',
  SAS: '#C4CED4', NYK: '#F58426',
};
const OWNER_COLORS = [
  '#c9a227','#5b8dd9','#e0523a','#5ab878','#b05ccc',
  '#e87d3e','#48b8c8','#d45090','#7c9e5a',
];
const RANK_LABELS = ['','🥇','🥈','🥉'];

function teamColor(abbr) {
  return NBA_COLORS[abbr] || '#555';
}

function renderLeaderboard(teams) {
  const max = teams[0]?.total || 1;
  const lb = document.getElementById('leaderboard');
  lb.innerHTML = `
    <div class="lb-row lb-header">
      <div class="lb-rank">RK</div>
      <div class="lb-name">Owner</div>
      <div class="lb-bar-cell"></div>
      <div class="lb-total">PRA</div>
    </div>` +
    teams.map((t, i) => {
      const rank = i + 1;
      const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
      const rankLabel = rank <= 3 ? RANK_LABELS[rank] : rank;
      const pct = max > 0 ? (t.total / max * 100) : 0;
      return `
      <div class="lb-row">
        <div class="lb-rank ${rankClass}">${rankLabel}</div>
        <div class="lb-name">${t.team}</div>
        <div class="lb-bar-cell">
          <div class="lb-bar-bg"><div class="lb-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="lb-total">${t.total}</div>
      </div>`;
    }).join('');
}

function renderCards(teams) {
  const sorted = [...teams].sort((a,b) => a.team.localeCompare(b.team));
  // show in leaderboard order (rank order)
  const cards = document.getElementById('cards');
  cards.innerHTML = teams.map((t, i) => {
    const rank = i + 1;
    const color = OWNER_COLORS[i % OWNER_COLORS.length];
    const initial = t.team[0].toUpperCase();
    const rankLabel = rank <= 3 ? RANK_LABELS[rank] : `#${rank}`;

    const playerRows = t.players.map(p => {
      const dot = `<span class="team-dot" style="background:${teamColor(p.nba_team)}"></span>`;
      const pra = p.pra > 0
        ? `<span class="stat-chip">${p.pts}/${p.reb}/${p.ast}</span><span class="pra-val" style="color:${teamColor(p.nba_team)}">${p.pra}</span>`
        : `<span class="no-games">—</span>`;
      return `
        <div class="player-row">
          ${dot}
          <div class="player-name-cell">${p.name}</div>
          <div class="player-stats">${pra}</div>
        </div>`;
    }).join('');

    return `
    <div class="team-card">
      <div class="card-header">
        <div class="card-owner">
          <div class="owner-avatar" style="background:${color}22;color:${color};border:2px solid ${color}40">${initial}</div>
          <div>
            <div class="owner-name">${t.team}</div>
            <div class="owner-rank">${rankLabel}</div>
          </div>
        </div>
        <div class="card-total">
          <div class="total-num">${t.total}</div>
          <div class="total-label">PRA</div>
        </div>
      </div>
      ${playerRows}
    </div>`;
  }).join('');
}

function formatUpdated(iso) {
  try {
    const d = new Date(iso);
    return 'Updated ' + d.toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit',timeZoneName:'short'});
  } catch { return 'Updated just now'; }
}

async function load() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error').style.display = 'none';
  document.getElementById('main').style.display = 'none';

  try {
    const res = await fetch('/api/scores');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);

    document.getElementById('last-updated').textContent = formatUpdated(json.updated);
    renderLeaderboard(json.data);
    renderCards(json.data);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'block';
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error-msg').textContent = 'Error: ' + e.message;
  }
}

load();
</script>
</body>
</html>
